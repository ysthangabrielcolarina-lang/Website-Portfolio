<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retro Pokedex</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>

<!-- LOGIN MODAL -->
<div id="login-form" class="modal">
    <div class="form-content"> <!-- holds login elements -->
        <h2>LOGIN</h2>

        <input type="text" id="login-username" placeholder="Username">
        <input type="password" id="login-password" placeholder="Password">

        <div class="form-buttons">
            <button class="btn-cancel" onclick="showRegisterForm()">REGISTER</button>
            <button class="btn-save" onclick="login()">LOGIN</button>
        </div>
    </div>
</div>

<!-- REGISTER MODAL -->
<div id="register-form" class="modal">
    <div class="form-content">
        <h2>REGISTER</h2>

        <input type="text" id="reg-username" placeholder="Username">
        <input type="password" id="reg-password" placeholder="Password">

        <div class="form-buttons">
            <button class="btn-cancel" onclick="showLoginFromRegister()">LOGIN</button>
            <button class="btn-save" onclick="register()">REGISTER</button>
        </div>
    </div>
</div>

<!-- GLOBAL NOTIFICATION -->
<div id="notification" class="notification">
    <span id="notif-message">Notification</span>   <!-- where the message text appears -->
</div>

<!-- POKEDEX CONTENT -->
<div id="pokedex-content" style="display:none;"> <!-- pokedex screen, hidden by default -->

    <h1>POKÉDEX</h1>

    <!-- CONTROLS -->
    <div class="controls">
        <input type="text" id="search" placeholder="Search name..." onkeyup="filterPokemon()">

        <select id="type-filter" onchange="filterPokemon()">
            <option value="">All Types</option>
            <option value="Fire">Fire</option>
            <option value="Water">Water</option>
            <option value="Grass">Grass</option>
            <option value="Bug">Bug</option>
            <option value="Normal">Normal</option>
            <option value="Poison">Poison</option>
            <option value="Flying">Flying</option>
        </select>

        <button onclick="showAddForm()">+ ADD</button>

        <!-- logout -->
        <button id="logout-btn" onclick="logout()" style="display:none;">  <!-- logout button, hidden -->
            LOGOUT
        </button>
    </div>

    <div id="pokemon-container"></div>
    <!-- ================= ADD FORM ================= -->
    <div id="add-form">
        <div class="form-content">
            <h2>NEW POKEMON</h2>

            <input type="text" id="new-name" placeholder="Name">
            <input type="text" id="new-type" placeholder="Type (e.g. Fire/Water)">
            <input type="number" step="0.1" id="new-height" placeholder="Height (m)">
            <input type="number" step="0.1" id="new-weight" placeholder="Weight (kg)">
            <input type="text" id="new-image" placeholder="Image URL">
            <textarea id="new-description" placeholder="Description"></textarea>

            <div class="form-buttons">
                <button class="btn-cancel" onclick="closeAddForm()">CANCEL</button>
                <button class="btn-save" onclick="addPokemon()">SAVE</button>
            </div>
        </div>
    </div>

    <!-- ================= POPUP ================= -->
    <div id="popup">
        <div class="popup-content">

            <span class="close-btn" onclick="closePopup()">&times;</span>

            <img id="popup-image" src="" alt="">
            <h2 id="popup-name"></h2>

            <p class="detail">ID: <span id="popup-id"></span></p>
            <p class="detail">Type: <span id="popup-type"></span></p>
            <p class="detail">Height: <span id="popup-height"></span> m</p>
            <p class="detail">Weight: <span id="popup-weight"></span> kg</p>

            <p class="description" id="popup-description"></p>

            <div class="form-buttons">
                <button class="btn-delete" onclick="deletePokemon()">DELETE</button>
                <button class="btn-save" onclick="showUpdateForm()">UPDATE</button>
            </div>

        </div>
    </div>

    <!-- ================= UPDATE FORM ================= -->
    <div id="update-form">
        <div class="form-content">

            <h2>UPDATE POKEMON</h2>

            <input type="number" step="0.1" id="update-height" placeholder="Height (m)">
            <input type="number" step="0.1" id="update-weight" placeholder="Weight (kg)">
            <textarea id="update-description" placeholder="Description"></textarea>

            <div class="form-buttons">
                <button class="btn-cancel" onclick="closeUpdateForm()">CANCEL</button>
                <button class="btn-save" onclick="updatePokemon()">SAVE</button>
            </div>

        </div>
    </div>

</div>

<script src="/js/app.js"></script>

</body>
</html>
